[project]
name = "caucus-race"
version = "0.1.0"
description = "AI エージェントによるスプリント開発のオーケストレーター"
readme = "README.md"
authors = [
    { name = "ishida", email = "ishida@laboro.ai" }
]
requires-python = ">=3.14"
dependencies = [
    "injector>=0.22",
    "mcp>=2.3.0",
    "pydantic>=2.11",
    "sqlalchemy>=2.0",
    "typer>=0.16",
]

[project.scripts]
caucus = "caucus_race.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/caucus_race/adapter/planner/prompts.py" = ["E501"]
# test_mcp_planning のフィクスチャ（env・planner）を import して共有する
"tests/test_mcp_server.py" = ["F401", "F811"]
